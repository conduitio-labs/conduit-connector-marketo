name: test

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        env:
          MARKETO_CLIENT_ID: ${{ secrets.MARKETO_CLIENT_ID }}
          MARKETO_CLIENT_SECRET: ${{ secrets.MARKETO_CLIENT_SECRET }}
          MARKETO_CLIENT_ENDPOINT : ${{ secrets.MARKETO_CLIENT_ENDPOINT }}
        run: make test GOTEST_FLAGS="-v -count=1"
